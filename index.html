<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="css/style.css">

</head>

<body>
    <div class="card">
        <h1>Создайте профиль в Bloom</h1>
        <p>Сохраните любимые букеты, отслеживайте заказы и получайте персональные предложения.</p>
        <form action=" https://postman-echo.com/post" mathod="get">

            <div id="namecont">
                <label for="name">Имя</label>
                <input id="name" type="text">
            </div>
            <div id="snamecont">
                <label for="sname">Фамилия</label>
                <input id="sname" type="text">
            </div>
            <div id="mailcont">
                <label for="mail">E-mail</label>
                <input id="mail" type="mail">
            </div>
            <div id="passwordcont">
                <label for="password">Пароль</label>
                <input id="password" type="password">
            </div>
            <div id="pccont">
                <label for="password-confirm">Повторите пароль</label>
                <input id="password-confirm" type="password">
            </div>
            <div id="confirmcont">
                <input id="confirm" type="checkbox">
                <label for="confirm" id="confirmlabel">Я принимаю условия использования сервиса и политику обработки
                    персональных данных. </label>
            </div>

            <button>Создать аккаунт</button>
        </form>
    </div>


</body>

</html>
